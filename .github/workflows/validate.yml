name: Validate calculator
on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run calculator smoke tests
        run: node tests/smoke.mjs
